apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glitch-hunt.fullname" . }}-api
  labels:
    {{- include "glitch-hunt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "glitch-hunt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "glitch-hunt.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: {{ include "glitch-hunt.fullname" . }}-redis
            - name: REDIS_PORT
              value: "{{ .Values.redis.service.port }}"
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: MINIO_REGION
              value: {{ .Values.minio.region | quote }}
            - name: MINIO_BUCKET_NAME
              value: {{ .Values.minio.bucketName | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "glitch-hunt.fullname" . }}-minio
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "glitch-hunt.fullname" . }}-minio
                  key: secret-key
            {{- if .Values.postgres.enabled }}
            - name: DB_HOST
              value: {{ .Values.postgres.clusterName }}-rw
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: {{ .Values.postgres.bootstrap.initdb.database | quote }}
            - name: DB_USER
              value: {{ .Values.postgres.bootstrap.initdb.owner | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName }}-app
                  key: password
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
