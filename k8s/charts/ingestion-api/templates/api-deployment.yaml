apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glitch-hunt.fullname" . }}
  labels:
    {{- include "glitch-hunt.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "glitch-hunt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "glitch-hunt.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ coalesce .Values.global.imageRegistry .Values.api.image.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: "glitch-hunt-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: {{ .Values.minio.endpoint | quote }}
            - name: MINIO_REGION
              value: {{ .Values.minio.region | quote }}
            - name: MINIO_BUCKET_NAME
              value: {{ .Values.minio.bucketName | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-minio" (include "glitch-hunt.fullname" .)) .Values.minio.existingSecret }}
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-minio" (include "glitch-hunt.fullname" .)) .Values.minio.existingSecret }}
                  key: secret-key
            - name: POSTGRES_SERVER
              value: "glitch-hunt-db-rw"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "ingest_db"
            - name: POSTGRES_USER
              value: "admin"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "glitch-hunt-db-app"
                  key: password
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
