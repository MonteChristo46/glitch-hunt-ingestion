# Default values for glitch-hunt.

api:
  replicaCount: 1
  image:
    repository: harbor.my-basement.cloud/shade-master/glitch-hunt-ingestion-api
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: glitch-hunt-ingestion.my-basement.cloud
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  env:
    # MINIO_ENDPOINT: "s3.my-basement.cloud" # Moved to config/secret
    # MINIO_REGION: "eu-central-1"
    # MINIO_BUCKET_NAME: "glitch-hunt-dev"
    logLevel: "info"
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  monitoring:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    # storageClass: ""

postgres:
  enabled: true
  # Settings for the CloudNativePG (CNPG) Cluster Resource
  clusterName: glitch-hunt-db
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 5Gi
    # storageClass: ""
  bootstrap:
    initdb:
      database: ingest_db
      owner: admin
  monitoring:
    enablePodMonitor: false

minio:
  endpoint: "blob.my-basement.cloud"
  region: "eu-central-1"
  bucketName: "glitch-hunt-dev"
  # If existingSecret is provided, accessKey and secretKey are ignored.
  # The secret must contain 'access-key' and 'secret-key' keys.
  existingSecret: ""
  # Use these only if existingSecret is empty.
  accessKey: ""
  secretKey: ""
