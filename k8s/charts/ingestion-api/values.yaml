# Default values for glitch-hunt.

api:
  replicaCount: 1
  image:
    registry: harbor.my-basement.cloud
    repository: shade-master/glitch-hunt-ingestion-api
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: glitch-hunt-ingestion.my-basement.cloud
        paths:
          - path: /
            pathType: Prefix
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  env:
    # S3_ENDPOINT: "s3.my-basement.cloud" # Moved to config/secret
    # S3_REGION: "eu-central-1"
    # S3_BUCKET_NAME: "glitch-hunt-dev"
    logLevel: "info"
    redisStreamMaxlen: "1000000"
    redisQuotaTtl: "60"
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  monitoring:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels:
        release: prometheus

minio:
  endpoint: "blob.my-basement.cloud"
  region: "eu-central-1"
  bucketName: "glitch-hunt-dev"
  # If existingSecret is provided, accessKey and secretKey are ignored.
  # The secret must contain 'access-key' and 'secret-key' keys.
  existingSecret: ""
  # Use these only if existingSecret is empty.
  accessKey: ""
  secretKey: ""
